<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B2D · binary/decimal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>B2D</h1>
  <div class="tag">binary &harr; decimal</div>
  <div class="box">
    <div class="row">
      <span class="badge active" id="modeBadge">BIN</span>
      <input type="text" id="inp" placeholder="1010" autofocus spellcheck="false" autocomplete="off">
    </div>
    <div class="out" id="out">10</div>
    <div class="hint" id="hint">&rarr; decimal</div>
  </div>
  <footer>B2D converter</footer>
</main>

<script src="script.js"></script>

</body>
</html>
