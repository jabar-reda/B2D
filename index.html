<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B2D · binary/decimal</title>
<style>
  /* Import the Nippo display font from Fontshare */
  @import url('https://api.fontshare.com/v2/css?f[]=nippo@200,300,400,500,700&display=swap');

  /* Global reset: remove default margins/padding and use border-box sizing */
  * { margin:0; padding:0; box-sizing:border-box }

  /* Dark full-viewport layout centered on the page */
  body { font-family:'Nippo',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#000; color:#fff; min-height:100vh; display:flex; align-items:center; justify-content:center }

  /* Main container: fixed width, padded */
  main { width:100%; max-width:420px; padding:2rem }

  /* Title styling: uppercase, wide letter-spacing, light weight */
  h1 { font-size:1.25rem; font-weight:300; letter-spacing:.2em; text-transform:uppercase; text-align:center; margin-bottom:.25rem }

  /* Subtitle tagline under the title */
  .tag { text-align:center; font-size:.7rem; color:#333; letter-spacing:.1em; margin-bottom:2rem }

  /* Card wrapper around the converter controls */
  .box { background:#0a0a0a; border:1px solid #1a1a1a; border-radius:4px; padding:1.25rem }

  /* Horizontal row holding the mode badge and input */
  .row { display:flex; align-items:center; gap:.75rem }

  /* Mode toggle badge (BIN / DEC) */
  .badge { font-size:.6rem; letter-spacing:.1em; text-transform:uppercase; padding:.25rem .5rem; border-radius:2px; background:#111; color:#444; white-space:nowrap; cursor:pointer; transition:all .15s; user-select:none }
  /* Active mode: inverted colors */
  .badge.active { background:#fff; color:#000 }
  .badge:hover { opacity:.7 }

  /* Text input: monospace, dark theme, left-to-right direction */
  input { flex:1; padding:.7rem; background:#111; border:1px solid #222; border-radius:4px; color:#fff; font-size:1rem; font-family:'SF Mono','Cascadia Code','Consolas',monospace; outline:0; transition:border .15s; direction:ltr }
  input:focus { border-color:#fff }
  input::placeholder { color:#333 }

  /* Result output area: monospace, selectable on click */
  .out { margin-top:.75rem; padding:.7rem; background:#111; border:1px solid #222; border-radius:4px; color:#fff; font-size:1rem; font-family:'SF Mono','Cascadia Code','Consolas',monospace; min-height:1rem; user-select:all; word-break:break-all }
  /* Error state: red text and border */
  .out.err { color:#ff4444; border-color:#442222 }

  /* Small hint below the output showing the conversion direction */
  .hint { margin-top:.5rem; font-size:.7rem; color:#222; text-align:center; letter-spacing:.02em }

  /* Footer caption */
  footer { margin-top:2rem; text-align:center; font-size:.65rem; color:#181818; letter-spacing:.1em }
</style>
</head>
<body>
<main>
  <h1>B2D</h1>
  <div class="tag">binary &harr; decimal</div>
  <div class="box">
    <div class="row">
      <span class="badge active" id="modeBadge">BIN</span>
      <input type="text" id="inp" placeholder="1010" autofocus spellcheck="false" autocomplete="off">
    </div>
    <div class="out" id="out">10</div>
    <div class="hint" id="hint">&rarr; decimal</div>
  </div>
  <footer>B2D converter</footer>
</main>

<script>
  // DOM element references
  const inp = document.getElementById('inp');
  const out = document.getElementById('out');
  const badge = document.getElementById('modeBadge');
  const hint = document.getElementById('hint');

  // Current conversion mode: 'bin' (binary -> decimal) or 'dec' (decimal -> binary)
  let mode = 'bin';

  // Convert the current input value according to the active mode
  function convert() {
    const v = inp.value.trim();
    if (!v) { out.textContent = ''; out.classList.remove('err'); return; }
    out.classList.remove('err');
    try {
      if (mode === 'bin') {
        // Binary input: validate it only contains 0 and 1, then parse to decimal
        if (!/^[01]+$/.test(v)) throw new Error('only 0 and 1 allowed');
        out.textContent = parseInt(v, 2).toLocaleString();
      } else {
        // Decimal input: parse as BigInt (handles arbitrarily large values) and convert to binary
        const n = BigInt(v);
        if (n < 0) throw new Error('positive numbers only');
        out.textContent = n.toString(2);
      }
    } catch(e) {
      out.textContent = e.message; out.classList.add('err');
    }
  }

  // Switch the conversion mode and update the UI labels
  function setMode(m) {
    mode = m;
    badge.textContent = m === 'bin' ? 'BIN' : 'DEC';
    hint.innerHTML = m === 'bin' ? '&rarr; decimal' : '&rarr; binary';
    convert();
  }

  // Toggle between binary and decimal mode on badge click
  badge.addEventListener('click', () => setMode(mode === 'bin' ? 'dec' : 'bin'));
  // Re-run conversion on every keystroke
  inp.addEventListener('input', convert);
</script>
</body>
</html>
